name: Test

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

# 최소 권한 원칙(GitHub Actions 보안 권장사항) — 이 워크플로우는 체크아웃·의존성
# 설치·테스트 실행만 하고 어떤 쓰기 작업(푸시/코멘트/릴리즈 등)도 하지 않으므로,
# 저장소 기본 GITHUB_TOKEN 권한 설정과 무관하게 읽기 전용으로 명시한다.
permissions:
  contents: read

jobs:
  unittest:
    strategy:
      fail-fast: false
      matrix:
        # 실제 사용자가 개발하는 환경(Windows)을 CI에도 반영한다 — ubuntu만 돌리면
        # tools/cli_utils.py의 Windows 콘솔 UTF-8 인코딩 처리 같은 플랫폼 특정
        # 동작을 CI가 전혀 검증하지 못한다.
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Run tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Check skills structure
        run: python scripts/check_skills.py

      - name: Check agents structure
        run: python scripts/check_agents.py
