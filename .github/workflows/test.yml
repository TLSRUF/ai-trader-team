name: Test

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

# 최소 권한 원칙(GitHub Actions 보안 권장사항) — 이 워크플로우는 체크아웃·의존성
# 설치·테스트 실행만 하고 어떤 쓰기 작업(푸시/코멘트/릴리즈 등)도 하지 않으므로,
# 저장소 기본 GITHUB_TOKEN 권한 설정과 무관하게 읽기 전용으로 명시한다.
permissions:
  contents: read

jobs:
  unittest:
    strategy:
      fail-fast: false
      matrix:
        # 실제 사용자가 개발하는 환경(Windows)을 CI에도 반영한다 — ubuntu만 돌리면
        # tools/cli_utils.py의 Windows 콘솔 UTF-8 인코딩 처리 같은 플랫폼 특정
        # 동작을 CI가 전혀 검증하지 못한다.
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
          # requirements.txt만 추적하면 requirements-dev.txt(ruff/coverage 버전 등)만
          # 바뀌었을 때 캐시 키가 그대로라 pip 캐시가 갱신되지 않는다 — 실제 설치
          # 커맨드(아래 "Install dependencies")가 쓰는 requirements-dev.txt와, 그것이
          # -r로 참조하는 requirements.txt 둘 다를 캐시 키에 반영한다.
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Run tests (with coverage)
        # tools/·scripts/의 라인 커버리지가 90% 밑으로 떨어지면 CI를 실패시킨다.
        # 90%는 임의의 목표치가 아니라, main() CLI 진입점의 정상/에러 경로 테스트를
        # 보강한 뒤(#197, #200) 실측한 현재 커버리지(98%)에 여유를 둔 하한선이다 —
        # 이후 새 코드가 테스트 없이 추가돼 커버리지가 서서히 깎이는 걸 방지한다.
        run: |
          coverage run --source=tools,scripts -m unittest discover -s tests -p "test_*.py" -v
          coverage report -m --fail-under=90

      - name: Check skills structure
        run: python scripts/check_skills.py

      - name: Check agents structure
        run: python scripts/check_agents.py
