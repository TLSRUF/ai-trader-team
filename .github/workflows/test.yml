name: Test

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

jobs:
  unittest:
    strategy:
      fail-fast: false
      matrix:
        # 실제 사용자가 개발하는 환경(Windows)을 CI에도 반영한다 — ubuntu만 돌리면
        # tools/cli_utils.py의 Windows 콘솔 UTF-8 인코딩 처리 같은 플랫폼 특정
        # 동작을 CI가 전혀 검증하지 못한다.
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Check skills structure
        run: python scripts/check_skills.py

      - name: Check agents structure
        run: python scripts/check_agents.py
