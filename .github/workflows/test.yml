name: Test

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Check skills structure
        run: python scripts/check_skills.py

      - name: Check agents structure
        run: python scripts/check_agents.py
